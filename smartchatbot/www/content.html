<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เนื้อหา</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['"Noto Sans Thai"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-2xl mx-auto p-4" id="contentContainer">
        <div class="hidden text-center text-red-600 p-5 bg-white rounded-lg shadow-sm mb-4" id="errorMessage">
            <p></p>
        </div>
        
        <template id="contentTemplate">
            <img src="" alt="" class="w-full h-auto rounded-lg mb-5 hidden" id="contentImage">
            <h1 class="text-2xl font-bold text-gray-900 mb-3" id="contentTitle"></h1>
            <div class="inline-block bg-gray-100 px-3 py-1 rounded-md text-sm text-gray-700 mb-4 hidden" id="contentType"></div>
            <div class="mb-5 hidden" id="tagsContainer"></div>
            <div class="text-gray-700 whitespace-pre-line mb-6" id="contentDescription"></div>
            <div class="prose prose-gray max-w-none mb-6 hidden" id="mainContent"></div>
            
        </template>
    </div>

    <script>
        async function fetchContent() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const contentName = urlParams.get('name');
                
                const response = await fetch(`/api/method/smartchatbot.api.v1.details.get_content?name=${encodeURIComponent(contentName)}`);
                const data = await response.json();
                
                if (data.message) {
                    displayContent(data.message.message);
                } else {
                    showError('ไม่พบข้อมูลเนื้อหา');
                }
            } catch (error) {
                showError('เกิดข้อผิดพลาดในการโหลดข้อมูล');
            }
        }

        function displayContent(content) {
            const template = document.getElementById('contentTemplate');
            const container = document.getElementById('contentContainer');
            container.innerHTML = template.innerHTML;

            if (content.image) {
                const imgElement = document.getElementById('contentImage');
                imgElement.src = content.image;
                imgElement.alt = content.title;
                imgElement.classList.remove('hidden');
            }

            document.getElementById('contentTitle').textContent = content.title;

            if (content.content_type) {
                const typeElement = document.getElementById('contentType');
                typeElement.textContent = content.content_type;
                typeElement.classList.remove('hidden');
            }

            if (content.product_categories.length > 0 || content.industries.length > 0) {
                const tagsContainer = document.getElementById('tagsContainer');
                tagsContainer.classList.remove('hidden');

                content.product_categories.forEach(cat => {
                    const span = document.createElement('span');
                    span.className = 'inline-block bg-gray-100 text-gray-600 px-2 py-1 rounded mr-2 mb-2 text-sm';
                    span.textContent = cat.category;
                    tagsContainer.appendChild(span);
                });

                content.industries.forEach(ind => {
                    const span = document.createElement('span');
                    span.className = 'inline-block bg-blue-100 text-blue-600 px-2 py-1 rounded mr-2 mb-2 text-sm';
                    span.textContent = ind.industry;
                    tagsContainer.appendChild(span);
                });
            }

            if (content.description) {
                document.getElementById('contentDescription').textContent = content.description;
            }

            if (content.content) {
                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = marked(content.content);
                mainContent.classList.remove('hidden');
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.querySelector('p').textContent = message;
            errorElement.classList.remove('hidden');
        }

        // เริ่มต้นโหลดข้อมูล
        fetchContent();
    </script>
</body>
</html>
