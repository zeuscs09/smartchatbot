<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}{{ product.title }}{% else %}ข้อมูลสินค้า{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['"Noto Sans Thai"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-2xl mx-auto p-4" id="productContainer">
        <div class="hidden text-center text-red-600 p-5 bg-white rounded-lg shadow-sm mb-4" id="errorMessage">
            <p></p>
        </div>
        
        <template id="productTemplate">
            <img src="" alt="" class="w-full h-auto rounded-lg mb-5 hidden" id="productImage">
            <h1 class="text-2xl font-bold text-gray-900 mb-3" id="productTitle"></h1>
            <div class="text-3xl font-bold text-red-600 mb-5" id="productPrice"></div>
            <div class="inline-block bg-gray-100 px-3 py-1 rounded-md text-sm text-gray-700 mb-4 hidden" id="productCategory"></div>
            <div class="mb-5 hidden" id="industriesContainer"></div>
            <div class="text-gray-700 whitespace-pre-line mb-6" id="productDescription"></div>
          
        </template>
    </div>

    <script>
        async function fetchProduct() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productName = urlParams.get('name');
                
                const response = await fetch(`/api/method/smartchatbot.api.v1.details.get_product?name=${encodeURIComponent(productName)}`);
                const data = await response.json();
                
                if (data.message) {
                    displayProduct(data.message);
                } else {
                    showError('ไม่พบข้อมูลสินค้า');
                }
            } catch (error) {
                showError('เกิดข้อผิดพลาดในการโหลดข้อมูล');
            }
        }

        function displayProduct(product) {
            product = product.message;

            const template = document.getElementById('productTemplate');
            const container = document.getElementById('productContainer');
            container.innerHTML = template.innerHTML;

            if (product.image) {
                const imgElement = document.getElementById('productImage');
                imgElement.src = product.image;
                imgElement.alt = product.title;
                imgElement.classList.remove('hidden');
            }

            document.getElementById('productTitle').textContent = product.title;
            document.getElementById('productPrice').textContent = `฿${numberWithCommas(product.price || 0)}`;

            if (product.product_category) {
                const categoryElement = document.getElementById('productCategory');
                categoryElement.textContent = product.product_category;
                categoryElement.classList.remove('hidden');
            }

            if (product.industry && product.industry.length > 0) {
                const industriesContainer = document.getElementById('industriesContainer');
                industriesContainer.classList.remove('hidden');
                product.industry.forEach(ind => {
                    const span = document.createElement('span');
                    span.className = 'inline-block bg-blue-600 text-white px-2 py-1 rounded mr-2 mb-2 text-sm';
                    span.textContent = ind.industry;
                    industriesContainer.appendChild(span);
                });
            }

            if (product.description) {
                document.getElementById('productDescription').textContent = product.description;
            }

            const contactButton = document.getElementById('contactButton');
            contactButton.href = `https://line.me/R/oaMessage/${window.lineId}/?สอบถามรายละเอียด ${product.name}`;
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.querySelector('p').textContent = message;
            errorElement.classList.remove('hidden');
        }

        function numberWithCommas(x) {
            return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // เริ่มต้นโหลดข้อมูล
        fetchProduct();
    </script>
</body>
</html>
